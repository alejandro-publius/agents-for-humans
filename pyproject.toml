[project]
name = "last-elevator"
version = "0.1.0"
description = "Last Elevator: a Strands agent that watches BART elevator outages for the trips you actually take and interrupts only when a trip is broken."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Alex Vintera" },
    { name = "Rachel Selbrede" },
]
dependencies = [
    "strands-agents>=1.55.1",
    "strands-agents-tools>=0.8.8",
    "strands-agents-evals>=1.2.0",
    "pydantic>=2.0",
    "certifi>=2024.0",
    "mcp>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/bart", "src/policy", "src/app", "kb"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["results", "fixtures", "kb", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "playwright>=1.62.0",
]

[tool.ruff.lint.per-file-ignores]
# Vendored from the dispatch package, which formats at 120 columns in its own CI; the nested
# ruff.toml files cover le_dispatch/, tests/dispatch/ and infra/, and these scripts sit beside
# this repository's own in scripts/, so their width is excused by name.
"scripts/ablation.py" = ["E501"]
"scripts/agentcore_deploy.py" = ["E501"]
"scripts/agentcore_eval.py" = ["E501"]
"scripts/agentcore_eval_local.py" = ["E501"]
