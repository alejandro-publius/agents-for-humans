[project]
name = "last-elevator"
version = "0.1.0"
description = "Last Elevator: a Strands agent that watches BART elevator outages for the trips you actually take and interrupts only when a trip is broken."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Alex Vintera" },
    { name = "Rachel Selbrede" },
]
dependencies = [
    "strands-agents>=1.55.1",
    "strands-agents-tools>=0.8.8",
    "strands-agents-evals>=1.2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["results", "fixtures", "kb", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
