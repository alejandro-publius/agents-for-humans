name: pages

# The evidence site (make site) published to GitHub Pages from main. Needs Pages switched on once in the
# repository settings (Settings, Pages, Source: GitHub Actions); until then the deploy job fails on its own
# and verify.yml is unaffected.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,a11y]" && playwright install chromium
      - run: make site
      - run: make site-a11y SITE_A11Y_ARGS="--site build/site"   # what is published is what was audited
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
